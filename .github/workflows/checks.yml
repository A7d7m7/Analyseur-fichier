name: Vérifications Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les composants graphiques
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb xauth
      - name: Installer le projet
        run: python -m pip install -e '.[dev]'
      - name: Vérifier le code
        run: |
          ruff check src tests
          ruff format --check src tests
          bash -n scripts/install-launchers.sh
      - name: Tester le moteur et l'interface
        run: xvfb-run -a python -m pytest -q
      - name: Construire le paquet
        run: python -m pip wheel --no-deps . -w dist
